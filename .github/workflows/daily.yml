name: Daily briefing podcast

on:
  schedule:
    # 09:00 UTC = 5:00 AM EDT / 4:00 AM EST. The hour shifts an hour around DST
    # for the recipient, which is fine for a morning briefing. If you want a
    # constant local-time delivery, switch to two crons (EDT vs EST months).
    - cron: '0 9 * * *'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Permissions are needed to commit today's recap back to the repo so tomorrow's
# run has dedupe memory.
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # GitHub Actions hosted runners have a 6-hour wall-clock limit. Episode runs
    # take ~15 min in practice — generous headroom.
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate podcast
        id: generate
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODCAST_BASE_DIR: ${{ github.workspace }}
        run: |
          set -o pipefail
          # podcast.py prints lots of logs plus a final JSON result line to stdout.
          # Tee to a file, then grab the last line that begins with `{` as the result.
          python -u podcast.py 2>&1 | tee run.log
          # The final JSON line is the last line starting with `{`
          grep -E '^\{.*"status".*\}$' run.log | tail -1 > result.json
          if [ ! -s result.json ]; then
            echo "::error::No JSON result line found in podcast.py output"
            tail -50 run.log
            exit 1
          fi
          # Quick sanity check
          python -c "import json,sys; r=json.load(open('result.json')); assert r['status']=='ok', r; print('ok')"

      - name: Deliver (Drive upload + email)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -u deliver.py --result-json result.json

      - name: Commit today's recap for dedupe memory
        # Even if delivery fails, we still want the recap committed so tomorrow's
        # run doesn't repeat today's topics.
        if: success() || failure()
        run: |
          if ls recaps/*.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recaps/
            if ! git diff --cached --quiet; then
              git commit -m "recap: $(date -u +%Y-%m-%d)"
              git push
            else
              echo "No recap changes to commit."
            fi
          fi

      - name: Prune old episode artifacts (>7 days)
        if: always()
        run: |
          if [ -d episodes ]; then
            find episodes -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
          fi

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: |
            run.log
            episodes/
          retention-days: 7
